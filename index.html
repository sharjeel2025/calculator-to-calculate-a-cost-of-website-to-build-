<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Cost Calculator</title>
    <link rel="stylesheet" href="style.css">

    <meta name="google-site-verification" content="mMFEsFQXJNGV8oG6HHheCiTk0SzY0BUaDwVrU3eU-F0" />
</head>
<body>
    <div class="container">
        <h1>Website Cost Calculator</h1>
        <p>Get an instant, transparent estimate for your next website project.</p>

        <form id="calculatorForm">
            <div class="form-group">
                <label for="websiteType">Website Type</label>
                <select id="websiteType">
                    <option value="business">Business</option>
                    <option value="ecommerce">eCommerce</option>
                    <option value="portfolio">Portfolio</option>
                    <option value="blog">Blog</option>
                </select>
            </div>

            <div class="form-group">
                <label for="pages">Number of Pages</label>
                <input type="number" id="pages" value="5" min="1" max="50">
            </div>

            <div class="form-group">
                <label for="designLevel">Design Level</label>
                <select id="designLevel">
                    <option value="template">Template</option>
                    <option value="premium">Premium Template</option>
                    <option value="custom">Fully Custom</option>
                </select>
            </div>

            <div class="form-group">
                <label>Add‑ons</label>
                <div class="addons">
                    <label><input type="checkbox" value="contact"> Contact Form</label>
                    <label><input type="checkbox" value="blog"> Blog System</label>
                    <label><input type="checkbox" value="seo"> SEO Optimisation</label>
                    <label><input type="checkbox" value="booking"> Booking System</label>
                </div>
            </div>

            <div class="result">
                <h2>Estimated Cost: <span id="totalCost">$0</span></h2>
                <p>Timeline: <span id="timeline">Planning → Development → Testing</span></p>
            </div>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
